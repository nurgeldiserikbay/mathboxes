<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Math Boxes — style proof (CSS only)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
	--navy:#0d1233;
	--navy-2:#161d47;
	--blue:#2f80ed;
	--cyan:#31b8d4;
	--violet:#7657e8;
	--green:#45c977;
	--coral:#f0645d;
	--gold:#f5b83d;
	--warm:#f8f7ff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05071a;
	font-family:'Nunito','Baloo 2',system-ui,sans-serif;
	-webkit-font-smoothing:antialiased}

.phone{
	position:relative;width:390px;height:844px;margin:0 auto;overflow:hidden;
	display:flex;flex-direction:column;
}

/* ============================================================ ФОН (CSS) ==
   Небо — многостоповый градиент. Облака — размытые радиальные пятна.
   Город и деревья — SVG-силуэты в два плана. Дымка — оверлей.            */
.sky{position:absolute;inset:0;
	background:
		radial-gradient(120% 60% at 50% 100%, rgba(255,176,120,.55) 0%, rgba(255,140,160,.28) 32%, rgba(255,140,160,0) 62%),
		linear-gradient(180deg,
			#0a1240 0%, #10205e 12%, #1b3288 26%, #2f4cae 40%,
			#5a55b8 52%, #8f5cae 62%, #c06f9c 70%, #e88f88 77%,
			#f7ad7e 83%, #ffc98f 88%, #6b4a86 92%, #3a2c5e 100%);
}
/* Звёздная крошка сверху */
.stars{position:absolute;inset:0;opacity:.5;
	background-image:
		radial-gradient(1.4px 1.4px at 12% 6%, #fff 50%, transparent 51%),
		radial-gradient(1.2px 1.2px at 34% 12%, #fff 50%, transparent 51%),
		radial-gradient(1.6px 1.6px at 62% 5%, #fff 50%, transparent 51%),
		radial-gradient(1.2px 1.2px at 82% 14%, #fff 50%, transparent 51%),
		radial-gradient(1.1px 1.1px at 22% 19%, #fff 50%, transparent 51%),
		radial-gradient(1.3px 1.3px at 71% 22%, #fff 50%, transparent 51%),
		radial-gradient(1.1px 1.1px at 47% 26%, #fff 50%, transparent 51%),
		radial-gradient(1.5px 1.5px at 92% 8%, #fff 50%, transparent 51%);
	background-repeat:no-repeat;
	mask-image:linear-gradient(180deg,#000 0%,#000 26%,transparent 42%);
}
/* Облака: три слоя мягких пятен с разным размытием */
.clouds{position:absolute;inset:0;overflow:hidden}
.clouds i{position:absolute;display:block;border-radius:50%;
	background:radial-gradient(60% 60% at 40% 40%, rgba(255,255,255,.75), rgba(255,214,224,.32) 55%, rgba(255,190,205,0) 75%);
	filter:blur(10px)}
.clouds i:nth-child(1){left:-10%;top:24%;width:210px;height:58px;opacity:.8}
.clouds i:nth-child(2){right:-14%;top:31%;width:250px;height:64px;opacity:.72}
.clouds i:nth-child(3){left:12%;top:38%;width:180px;height:48px;opacity:.6;filter:blur(12px)}
.clouds i:nth-child(4){right:2%;top:45%;width:270px;height:60px;opacity:.5;filter:blur(15px)}
.clouds i:nth-child(5){left:-18%;top:52%;width:230px;height:52px;opacity:.42;filter:blur(17px)}
.clouds i:nth-child(6){right:-8%;top:57%;width:290px;height:56px;opacity:.34;filter:blur(20px);
	background:radial-gradient(60% 60% at 40% 40%, rgba(255,226,200,.8), rgba(255,190,170,.3) 55%, transparent 75%)}
.clouds i:nth-child(7){left:6%;top:62%;width:250px;height:44px;opacity:.3;filter:blur(20px);
	background:radial-gradient(60% 60% at 40% 40%, rgba(255,214,170,.85), rgba(255,180,150,.3) 55%, transparent 75%)}

.city{position:absolute;left:0;width:100%;display:block}
.city--far{bottom:196px;height:150px;opacity:.3;filter:blur(1px)}
.city--mid{bottom:168px;height:180px;opacity:.5;filter:blur(.4px)}
.city--near{bottom:132px;height:210px;opacity:.82}
.trees{position:absolute;left:0;bottom:104px;width:100%;height:130px;display:block;opacity:.95}

/* Атмосферная дымка у горизонта + затемнение к краям кадра */
.haze{position:absolute;inset:0;pointer-events:none;
	background:
		linear-gradient(180deg, rgba(10,16,52,.5) 0%, rgba(10,16,52,0) 20%),
		linear-gradient(180deg, transparent 62%, rgba(255,196,150,.16) 74%, transparent 84%),
		radial-gradient(140% 70% at 50% 58%, rgba(255,255,255,0) 46%, rgba(9,12,40,.34) 100%);
}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.05;
	background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
	mix-blend-mode:overlay}

/* ==================================================================== HUD */
.hud{position:relative;z-index:5;padding:12px 12px 0;
	display:flex;align-items:flex-start;gap:8px}

.rbtn{width:44px;height:44px;flex:0 0 44px;border:none;border-radius:50%;cursor:pointer;
	background:linear-gradient(180deg,#8f7bf5,#6246d6);
	box-shadow:
		inset 0 2px 0 rgba(255,255,255,.55),
		inset 0 -5px 0 rgba(0,0,0,.22),
		0 4px 0 #3f2ba0,
		0 8px 14px rgba(5,8,30,.5);
	display:flex;align-items:center;justify-content:center;color:#fff}
.rbtn svg{width:18px;height:18px}

.crown{display:flex;align-items:center;gap:5px;height:44px;padding:0 4px;
	font-weight:900;font-size:17px;color:#fff;
	text-shadow:0 2px 0 rgba(10,14,45,.55)}
.crown svg{width:20px;height:20px}

.spacer{flex:1}

.panel{
	background:linear-gradient(180deg,#1c2450,#121838);
	border-radius:14px;
	box-shadow:
		inset 0 1px 0 rgba(255,255,255,.14),
		inset 0 -4px 0 rgba(0,0,0,.35),
		0 4px 0 rgba(6,9,30,.85),
		0 9px 16px rgba(4,6,24,.5);
	padding:5px 12px 7px;text-align:center;color:#fff}
.panel__cap{font-size:9px;font-weight:900;letter-spacing:1.6px;color:#9fb0e0;text-transform:uppercase}
.panel__val{font-family:'Baloo 2',sans-serif;font-size:26px;font-weight:800;line-height:1.05;
	text-shadow:0 2px 0 rgba(6,9,30,.6)}

.hearts{display:flex;gap:4px;height:44px;align-items:center}
.hearts svg{width:24px;height:24px;filter:drop-shadow(0 2px 3px rgba(6,9,30,.55))}

/* =============================================================== ПРИМЕР ==
   Белая карточка — визуальный герой экрана.                              */
.ask{position:relative;z-index:5;margin:12px 14px 0;
	background:linear-gradient(180deg,#ffffff,#eef1fb);
	border-radius:20px;padding:12px 16px 11px;
	box-shadow:
		inset 0 2px 0 rgba(255,255,255,1),
		inset 0 -6px 0 rgba(160,170,205,.45),
		0 6px 0 rgba(120,132,175,.55),
		0 14px 22px rgba(5,8,30,.45)}
.ask__expr{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:38px;line-height:1;
	text-align:center;color:#141a3d;letter-spacing:1px}
.ask__row{display:flex;align-items:center;gap:8px;margin-top:9px}
.ask__clock{width:18px;height:18px;flex:0 0 18px;color:#5a6690}
.ask__bar{position:relative;flex:1;height:13px;border-radius:7px;
	background:#101838;box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
.ask__bar b{position:absolute;inset:2px auto 2px 2px;width:62%;border-radius:5px;
	background:linear-gradient(180deg,#6fe08f,#33b463);
	box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.ask__sec{font-weight:900;font-size:15px;color:var(--coral)}

/* ========================================================== ЧИПЫ КОМБО ==*/
.chips{position:relative;z-index:5;display:flex;gap:8px;margin:9px 14px 0}
.chip{flex:1;display:flex;align-items:center;gap:7px;
	background:linear-gradient(180deg,#1c2450,#121838);border-radius:13px;padding:6px 10px;
	box-shadow:inset 0 1px 0 rgba(255,255,255,.13),inset 0 -3px 0 rgba(0,0,0,.34),
		0 3px 0 rgba(6,9,30,.8),0 7px 12px rgba(4,6,24,.42)}
.chip svg{width:17px;height:17px;flex:0 0 17px}
.chip__cap{font-size:9px;font-weight:900;letter-spacing:1.3px;color:#9fb0e0;text-transform:uppercase;line-height:1.2}
.chip__val{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:17px;line-height:1;color:#fff}
.chip__val--gold{color:var(--gold)}
.chip__val--green{color:#7de3a0}

/* ================================================================ БАШНЯ ==*/
.stage{position:relative;z-index:4;flex:1;min-height:0}

/* Лучи за приземлившимся блоком: конический градиент + маска */
.rays{position:absolute;left:50%;top:-56px;width:260px;height:260px;z-index:1;
	transform:translateX(-50%);pointer-events:none;
	background:conic-gradient(from 0deg,
		rgba(200,255,150,.9) 0deg 3deg, transparent 3deg 16deg,
		rgba(200,255,150,.62) 16deg 19deg, transparent 19deg 34deg,
		rgba(200,255,150,.8) 34deg 37deg, transparent 37deg 52deg,
		rgba(200,255,150,.48) 52deg 55deg, transparent 55deg 72deg,
		rgba(200,255,150,.8) 72deg 75deg, transparent 75deg 92deg,
		rgba(200,255,150,.58) 92deg 95deg, transparent 95deg 115deg,
		rgba(200,255,150,.85) 115deg 118deg, transparent 118deg 140deg,
		rgba(200,255,150,.52) 140deg 143deg, transparent 143deg 168deg,
		rgba(200,255,150,.8) 168deg 171deg, transparent 171deg 196deg,
		rgba(200,255,150,.58) 196deg 199deg, transparent 199deg 226deg,
		rgba(200,255,150,.8) 226deg 229deg, transparent 229deg 254deg,
		rgba(200,255,150,.48) 254deg 257deg, transparent 257deg 286deg,
		rgba(200,255,150,.8) 286deg 289deg, transparent 289deg 316deg,
		rgba(200,255,150,.62) 316deg 319deg, transparent 319deg 344deg,
		rgba(200,255,150,.8) 344deg 347deg, transparent 347deg 360deg);
	mask-image:radial-gradient(closest-side, rgba(0,0,0,1) 8%, rgba(0,0,0,.55) 38%, transparent 68%);
	filter:blur(.5px)}

.tower{position:absolute;left:50%;top:34px;transform:translateX(-50%);
	width:182px;display:flex;flex-direction:column;gap:6px}

/* --- ПЛИТА ЭТАЖА ---------------------------------------------------------
   Тело — вертикальный градиент, сверху блик, снизу тёмная «губа»,
   под ней сплошная тень-объём и мягкая тень на фон.                      */
.slab{position:relative;height:62px;border-radius:15px;
	display:flex;align-items:center;justify-content:center;
	background:linear-gradient(180deg,var(--top) 0%,var(--mid) 52%,var(--bot) 100%);
	box-shadow:
		inset 0 2px 0 rgba(255,255,255,.5),
		inset 2px 0 0 rgba(255,255,255,.16),
		inset -2px 0 0 rgba(0,0,0,.14),
		inset 0 -7px 0 rgba(0,0,0,.2),
		0 5px 0 var(--lip),
		0 11px 16px rgba(5,8,30,.42)}
/* Очень слабая текстура поверхности */
.slab::after{content:'';position:absolute;inset:0;border-radius:13px;pointer-events:none;
	opacity:.16;mix-blend-mode:soft-light;
	background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='80' height='80' filter='url(%23n)'/></svg>")}
.slab b{position:relative;z-index:2;font-family:'Baloo 2',sans-serif;font-weight:800;
	font-size:34px;color:#fff;line-height:1;
	text-shadow:0 2px 0 rgba(10,20,60,.42),0 4px 8px rgba(6,10,36,.34)}

.slab--cyan  {--top:#57d3ef;--mid:#2fa8d6;--bot:#2189bd;--lip:#166a95}
.slab--blue  {--top:#5aa8f8;--mid:#2f80ed;--bot:#2668cb;--lip:#1a4d9d}
.slab--violet{--top:#9b7cf5;--mid:#7657e8;--bot:#6144c8;--lip:#43309a}
.slab--gold  {--top:#ffd873;--mid:#f5b83d;--bot:#dc9a24;--lip:#a86f13}
.slab--green {--top:#7ee49a;--mid:#45c977;--bot:#33a95f;--lip:#1f7f45}
.slab--coral {--top:#ff8b84;--mid:#f0645d;--bot:#d54a45;--lip:#9d2f2c}

/* Свежий блок: подсветка контура и ореол */
.slab--fresh{box-shadow:
		inset 0 2px 0 rgba(255,255,255,.6),
		inset 0 -7px 0 rgba(0,0,0,.18),
		0 0 0 3px rgba(190,255,140,.85),
		0 5px 0 var(--lip),
		0 0 26px 6px rgba(150,240,110,.5),
		0 11px 18px rgba(5,8,30,.4)}
/* Опора: золотой ореол и щит в углу */
.slab--pin{box-shadow:
		inset 0 2px 0 rgba(255,255,255,.55),
		inset 0 -7px 0 rgba(0,0,0,.2),
		0 0 0 3px rgba(255,214,120,.9),
		0 5px 0 var(--lip),
		0 0 24px 5px rgba(255,196,80,.45),
		0 11px 18px rgba(5,8,30,.4)}
.slab__shield{position:absolute;right:9px;top:50%;transform:translateY(-50%);
	width:19px;height:19px;color:#fff9e6;
	filter:drop-shadow(0 1px 2px rgba(120,70,0,.55))}

/* Текстовый эффект «+1 ЭТАЖ!»: два слоя — обводка снизу, заливка сверху */
.pop{position:absolute;right:8px;top:26px;z-index:6;white-space:nowrap}
.pop span{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:19px;letter-spacing:.3px;
	display:block}
	.pop .back{-webkit-text-stroke:6px #16351a;color:#16351a;
	filter:drop-shadow(0 0 10px rgba(140,240,110,.75))}
.pop .front{position:absolute;inset:0;
	background:linear-gradient(180deg,#eaffc4,#79e05b 62%,#37b23f);
	-webkit-background-clip:text;background-clip:text;color:transparent}

/* Рейка звёзд слева */
.rail{position:absolute;left:8px;top:120px;width:26px;padding:8px 0;
	display:flex;flex-direction:column;align-items:center;gap:12px;
	background:linear-gradient(180deg,#1c2450,#121838);border-radius:14px;
	box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 4px 0 rgba(6,9,30,.8),0 8px 14px rgba(4,6,24,.42)}
.rail svg{width:18px;height:18px}
.rail .on{color:var(--gold);filter:drop-shadow(0 0 6px rgba(245,184,61,.8))}
.rail .off{color:#2b3566}

/* Земля под башней */
.ground{position:absolute;left:-8%;right:-8%;bottom:0;height:56px;
	background:
		linear-gradient(180deg,#5b4f7f 0 7px,#3a3260 7px 16px,#282146 16px 100%);
	border-radius:10px 10px 0 0;
	box-shadow:inset 0 2px 0 rgba(255,255,255,.22),0 -12px 26px rgba(6,9,30,.45)}
/* Кладка полки */
.ground::after{content:'';position:absolute;left:0;right:0;top:16px;bottom:0;opacity:.5;
	background-image:
		linear-gradient(90deg, rgba(0,0,0,.35) 0 2px, transparent 2px 46px),
		linear-gradient(180deg, rgba(255,255,255,.07) 0 1px, transparent 1px 20px);
	background-size:46px 20px, 46px 20px}
/* Трава и кусты по кромке */
.ground::before{content:'';position:absolute;left:0;right:0;top:-16px;height:20px;
	background:
		radial-gradient(58% 100% at 8% 100%, #2f6b3a 62%, transparent 63%),
		radial-gradient(46% 100% at 22% 100%, #3b8047 62%, transparent 63%),
		radial-gradient(52% 100% at 36% 100%, #2b6236 62%, transparent 63%),
		radial-gradient(40% 100% at 52% 100%, #34713e 62%, transparent 63%),
		radial-gradient(56% 100% at 68% 100%, #2f6b3a 62%, transparent 63%),
		radial-gradient(44% 100% at 84% 100%, #3b8047 62%, transparent 63%),
		radial-gradient(50% 100% at 96% 100%, #2b6236 62%, transparent 63%)}

/* ============================================================== ОТВЕТЫ ==*/
.pad{position:relative;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);
	gap:8px;padding:0 12px 16px}
.ansv{position:relative;height:62px;border:none;border-radius:17px;cursor:pointer;
	font-family:'Baloo 2',sans-serif;font-weight:800;font-size:26px;color:#fff;
	background:linear-gradient(180deg,var(--top),var(--mid) 55%,var(--bot));
	text-shadow:0 2px 0 rgba(10,20,60,.45);
	box-shadow:
		inset 0 3px 0 rgba(255,255,255,.5),
		inset 0 -7px 0 rgba(0,0,0,.2),
		0 6px 0 var(--lip),
		0 12px 18px rgba(5,8,30,.45)}
.ansv--violet{--top:#9b7cf5;--mid:#7657e8;--bot:#6144c8;--lip:#43309a}
.ansv--blue{--top:#5aa8f8;--mid:#2f80ed;--bot:#2668cb;--lip:#1a4d9d}
.ansv--green{--top:#7ee49a;--mid:#45c977;--bot:#33a95f;--lip:#1f7f45;
	box-shadow:
		inset 0 3px 0 rgba(255,255,255,.55),
		inset 0 -7px 0 rgba(0,0,0,.18),
		0 0 0 3px rgba(190,255,140,.9),
		0 6px 0 var(--lip),
		0 0 22px 4px rgba(150,240,110,.5),
		0 12px 18px rgba(5,8,30,.4)}
.ansv--magenta{--top:#d886f0;--mid:#b658d8;--bot:#9a43bb;--lip:#6d2b88}
/* Искры над нажатой кнопкой */
.ansv--green::before{content:'';position:absolute;left:50%;top:-13px;width:34px;height:14px;
	transform:translateX(-50%);
	background:
		linear-gradient(#ffd94a,#ffd94a) 0 2px/3px 11px no-repeat,
		linear-gradient(#ffd94a,#ffd94a) 15px 0/3px 13px no-repeat,
		linear-gradient(#ffd94a,#ffd94a) 30px 2px/3px 11px no-repeat;
	transform:translateX(-50%) rotate(0deg);
	mask-image:linear-gradient(#000,#000)}
</style>
</head>
<body>
<div class="phone">
	<div class="sky"></div>
	<div class="stars"></div>
	<div class="clouds"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

	<!-- Дальний план города -->
	<svg class="city city--far" viewBox="0 0 390 200" preserveAspectRatio="none" aria-hidden="true">
		<path fill="#3b3b72" d="M0 200V120h18v-16h14v16h16V96h12v24h20v-40h10v40h14v-30h16v30h18v-52h9v52h17v-22h15v22h18v-36h11v36h16v-58h10v58h18v-26h14v26h17v-44h12v44h20v-34h11v34h16v-20h14v20h18V88h9v112z"/>
	</svg>
	<!-- Средний план -->
	<svg class="city city--mid" viewBox="0 0 390 180" preserveAspectRatio="none" aria-hidden="true">
		<path fill="#4a3f7d" d="M0 180V128h16v-20h13v20h17V96h11v32h18V78h9v50h15v-26h17v26h16V64h9v64h18v-30h13v30h17V88h11v40h19V70h10v58h16v-24h15v24h17V92h12v36h20v-46h10v46h15v-18h14v18h17V84h9v96z"/>
	</svg>
	<!-- Ближний план города -->
	<svg class="city city--near" viewBox="0 0 390 230" preserveAspectRatio="none" aria-hidden="true">
		<path fill="#2a2352" d="M0 230V150h22v-24h16v24h18v-40h14v40h16v-62l8-22 8 22v62h18v-34h20v34h16v-48h12v48h18v-70h10v70h16v-30h18v30h14v-56h12v56h20v-40h14v40h16v-24h18v24h16v-64h10v64h18v-28h14v28h6v80z"/>
		<g fill="#ffd489" opacity=".55">
			<rect x="26" y="136" width="3" height="4" rx="1"/><rect x="32" y="144" width="3" height="4" rx="1"/>
			<rect x="60" y="122" width="3" height="4" rx="1"/><rect x="66" y="134" width="3" height="4" rx="1"/>
			<rect x="60" y="146" width="3" height="4" rx="1"/><rect x="98" y="86" width="3" height="4" rx="1"/>
			<rect x="104" y="98" width="3" height="4" rx="1"/><rect x="98" y="114" width="3" height="4" rx="1"/>
			<rect x="128" y="130" width="3" height="4" rx="1"/><rect x="136" y="142" width="3" height="4" rx="1"/>
			<rect x="158" y="108" width="3" height="4" rx="1"/><rect x="164" y="124" width="3" height="4" rx="1"/>
			<rect x="158" y="140" width="3" height="4" rx="1"/><rect x="194" y="76" width="3" height="4" rx="1"/>
			<rect x="200" y="92" width="3" height="4" rx="1"/><rect x="194" y="110" width="3" height="4" rx="1"/>
			<rect x="200" y="130" width="3" height="4" rx="1"/><rect x="228" y="118" width="3" height="4" rx="1"/>
			<rect x="234" y="134" width="3" height="4" rx="1"/><rect x="262" y="96" width="3" height="4" rx="1"/>
			<rect x="268" y="112" width="3" height="4" rx="1"/><rect x="262" y="132" width="3" height="4" rx="1"/>
			<rect x="300" y="122" width="3" height="4" rx="1"/><rect x="308" y="138" width="3" height="4" rx="1"/>
